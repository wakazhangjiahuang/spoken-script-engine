name: Validate and package spoken-script-engine Skill

on:
  push:
    branches: [main]
    paths:
      - "releases/3.1.0/**"
      - "releases/3.2.0/**"
      - "REPO-REGISTRY.json"
      - "README.md"
      - ".github/workflows/package-skill.yml"

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime test dependency
        run: python -m pip install --upgrade pip openpyxl

      - name: Run legacy 3.1.0 regression suite
        working-directory: releases/3.1.0
        run: python -m unittest discover -s scripts -p "test_*.py" -v

      - name: Run V4.1 3.2.0 overlay regression suite
        working-directory: releases/3.2.0/skills/spoken-script-engine
        run: python -m unittest discover -s scripts -p "test_*.py" -v

      - name: Build explicitly labeled V4.1 overlay package
        run: |
          mkdir -p dist/spoken-script-engine-v4.1-overlay
          cp -R releases/3.2.0/skills/spoken-script-engine/. dist/spoken-script-engine-v4.1-overlay/
          cp releases/3.2.0/README.md dist/spoken-script-engine-v4.1-overlay/RELEASE-README.md
          find dist/spoken-script-engine-v4.1-overlay -type d -name "__pycache__" -prune -exec rm -rf {} +
          cd dist
          zip -qr spoken-script-engine-v4.1-overlay-3.2.0.zip spoken-script-engine-v4.1-overlay

      - name: Upload V4.1 overlay artifact
        uses: actions/upload-artifact@v4
        with:
          name: spoken-script-engine-v4.1-overlay-3.2.0
          path: dist/spoken-script-engine-v4.1-overlay-3.2.0.zip
          if-no-files-found: error
          retention-days: 14
