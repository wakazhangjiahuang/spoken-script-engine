name: Validate and package spoken-script-engine Skill

on:
  push:
    branches: [main]
    paths:
      - "releases/3.0.2/**"
      - ".github/workflows/package-skill.yml"

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime test dependency
        run: python -m pip install --upgrade pip openpyxl
      - name: Run regression suite
        working-directory: releases/3.0.2
        run: python -m unittest discover -s scripts -p "test_*.py" -v
      - name: Build standalone Skill ZIP
        run: |
          mkdir -p dist/spoken-script-engine
          cp -R releases/3.0.2/. dist/spoken-script-engine/
          find dist/spoken-script-engine -type d -name "__pycache__" -prune -exec rm -rf {} +
          cd dist
          zip -qr spoken-script-engine-skill-3.0.2.zip spoken-script-engine
      - name: Upload Skill package artifact
        uses: actions/upload-artifact@v4
        with:
          name: spoken-script-engine-skill-3.0.2
          path: dist/spoken-script-engine-skill-3.0.2.zip
          if-no-files-found: error
          retention-days: 14
