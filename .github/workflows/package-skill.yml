name: Validate and package spoken-script-engine Skill

on:
  push:
    branches: [main]
    paths:
      - "releases/3.5.0/**"
      - "releases/3.5.1/**"
      - "releases/3.6.0/**"
      - "releases/3.6.1/**"
      - "scripts/assemble_skill_release.py"
      - "REPO-REGISTRY.json"
      - "README.md"
      - ".github/workflows/package-skill.yml"
  pull_request:
    paths:
      - "releases/3.5.0/**"
      - "releases/3.5.1/**"
      - "releases/3.6.0/**"
      - "releases/3.6.1/**"
      - "scripts/assemble_skill_release.py"
      - "REPO-REGISTRY.json"
      - "README.md"
      - ".github/workflows/package-skill.yml"

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime test dependency
        run: python -m pip install --upgrade pip openpyxl pypdf
      - name: Run legacy 3.1.0 regression suite
        working-directory: releases/3.1.0
        run: python -m unittest discover -s scripts -p "test_*.py" -v
      - name: Run V4.1 3.2.0 overlay regression suite
        working-directory: releases/3.2.0/skills/spoken-script-engine
        run: python -m unittest discover -s scripts -p "test_*.py" -v
      - name: Run 3.2.1 sample governance tests
        working-directory: releases/3.2.1
        run: python -m unittest discover -s scripts -p "test_*.py" -v
      - name: Run v3.5.0 content-payoff regression suite
        working-directory: releases/3.5.0
        run: python -m unittest discover -s scripts -p "test_content_quality_v350.py" -v
      - name: Run v3.5.1 formal V4.1 wiring regression suite
        working-directory: releases/3.5.1
        run: python -m unittest discover -s tests -p "test_formal_v41_gate_v351.py" -v
      - name: Run v3.6.0 source-first marketing regression suite
        working-directory: releases/3.6.0
        run: |
          python -m py_compile scripts/marketing_quality_gate_v360.py scripts/run_pipeline_v3_6.py
          python -m unittest discover -s tests -p "test_marketing_quality_gate_v360.py" -v
          python -m unittest discover -s tests -p "test_release_manifest_v360.py" -v
          python -m json.tool references/benchmark-governance-v360.json > /dev/null
          python -m json.tool schemas/marketing-review-v360.schema.json > /dev/null
          python -m json.tool schemas/source-inventory-v360.schema.json > /dev/null
      - name: Run v3.6.1 four-layer evidence closure tests
        working-directory: releases/3.6.1
        run: |
          python -m py_compile scripts/acceptance_contract_v361.py scripts/run_pipeline_v3_6_1.py
          python -m unittest discover -s tests -p "test_acceptance_contract_v361.py" -v
          python -m unittest discover -s tests -p "test_release_manifest_v361.py" -v
          for f in schemas/*.json; do python -m json.tool "$f" > /dev/null; done
      - name: Test complete Skill assembler
        run: python -m unittest scripts.test_assemble_skill_release -v

      - name: Assemble complete v3.6.1 Skill package
        run: python scripts/assemble_skill_release.py --repo . --output-dir dist/complete-skill --zip dist/spoken-script-engine-v3.6.1-skill.zip
      - name: Build v3.6.1 overlay package
        run: |
          mkdir -p dist/spoken-script-engine-v3.6.1-overlay
          cp -R releases/3.6.1/. dist/spoken-script-engine-v3.6.1-overlay/
          find dist/spoken-script-engine-v3.6.1-overlay -type d -name "__pycache__" -prune -exec rm -rf {} +
          cd dist
          zip -qr spoken-script-engine-v3.6.1-overlay.zip spoken-script-engine-v3.6.1-overlay
      - name: Upload complete Skill and overlay artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spoken-script-engine-v3.6.1-downloads
          path: |
            dist/spoken-script-engine-v3.6.1-skill.zip
            dist/spoken-script-engine-v3.6.1-overlay.zip
          if-no-files-found: error
          retention-days: 30
